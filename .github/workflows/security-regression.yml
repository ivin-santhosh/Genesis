name: Genesis Security and Syntax Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Genesis
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile tracked Python source
        run: python -m compileall -q Genesis
      - name: Run deterministic unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s Genesis/tests -v
      - name: Run checkpointed CLI smoke demo
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m Genesis.runtime --db /tmp/genesis-ci-state.sqlite3 demo
          python -m Genesis.runtime --db /tmp/genesis-ci-state.sqlite3 tools
      - name: Verify first-run module startup without installed Ollama
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import subprocess, sys; p=subprocess.run([sys.executable,'-m','Genesis'], input='/calc 5+7\n/demo\n/quit\n', text=True, capture_output=True, timeout=30); print(p.stdout); print(p.stderr); assert p.returncode == 0; assert '12.0' in p.stdout; assert 'PASS' in p.stdout"
